---
- name: AWS - Security Group and NACL
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/aws.yml

  tasks:

    - name: Create Security Group
      amazon.aws.ec2_security_group:
        name: ansible-demo-sg
        description: Demo security group
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [22, 80]
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow SSH and HTTP

    - name: Create Network ACL
      amazon.aws.ec2_vpc_nacl:
        name: ansible-demo-nacl
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ subnet_id }}"
        ingress:
          - [100, tcp, allow, "0.0.0.0/0", null, null, 22, 22]
          - [110, tcp, allow, "0.0.0.0/0", null, null, 80, 80]
        egress:
          - [100, all, allow, "0.0.0.0/0", null, null, null, null]